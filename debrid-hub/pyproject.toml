[project]
name = "debrid-hub"
version = "1.0.0"
description = "Aggregate direct download links across debrid services (Real-Debrid, AllDebrid, TorBox) for JDownloader2. CLI + API + web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "typer>=0.12",
  "rich>=13.0",
  "cryptography>=42.0",
]

[project.scripts]
debrid-hub = "debrid_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrid_hub"]

[tool.hatch.build.targets.wheel.force-include]
"src/debrid_hub/web" = "debrid_hub/web"
