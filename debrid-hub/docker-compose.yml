# Image: ghcr.io/ferrandj/debrid-hub, built + pushed by
# .github/workflows/docker-publish.yml on every push to master (amd64+arm64).
# Deploying an update anywhere (e.g. a NAS) is then just:
#   docker compose pull && docker compose up -d
# -- no rebuild on that machine, no manual image transfer.
#
# The GHCR package inherits this repo's visibility (private). To pull it from
# another machine, log in once with a GitHub personal access token that has
# the `read:packages` scope (classic token, or a fine-grained token scoped to
# this repo's package):
#   echo <token> | docker login ghcr.io -u <github-username> --password-stdin
#
# Prefer to build locally instead (e.g. while developing)? Swap the two lines
# below: comment out `image:`, uncomment `build: .`.
#
# Two ways to get provider keys into this container -- pick one per key:
#
# 1) Plain env vars below (via .env or your shell). Simplest, but the key sits
#    in cleartext in .env / `docker inspect` / your shell history for as long
#    as it's set there. Fine for a quick trial or a host only you can reach.
#
# 2) Never put the key in the compose file at all: leave it blank here, start
#    the container, then write it straight into the encrypted store (which
#    lives on the `debrid-hub-data` volume, not in this file):
#      docker compose exec debrid-hub debrid-hub config set torbox <key>
#    If debrid-hub was already running when you did that, hit **Load** in the
#    UI's Keys panel (or `curl -X POST localhost:8080/api/config/reload`) so
#    the live server picks it up without a restart. This is also how you seed
#    the store from a key generated/rotated on another machine: copy the
#    `secrets.enc` + `secret.key` pair from that machine's data dir into this
#    one's volume (matching DEBRID_HUB_SECRET_KEY if you didn't use the
#    generated key file), then Load.
services:
  debrid-hub:
    image: ghcr.io/ferrandj/debrid-hub:latest
    # build: .   # uncomment to build locally instead of pulling
    container_name: debrid-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Encrypted keys + the auto-generated master key live here. Without this
      # volume, both are lost when the container is recreated.
      - debrid-hub-data:/data
      # Optional: JD2 watch-folder drop, instead of clipboard -- point
      # JDownloader2's FolderWatch extension at the same host path.
      # - /path/on/host/jd2-watch:/watch
    environment:
      # One env var per provider -- see note above on cleartext vs. encrypted.
      # Leave blank and use `config set` / the UI instead if that matters to you.
      DEBRID_REALDEBRID_TOKEN: "${DEBRID_REALDEBRID_TOKEN:-}"
      DEBRID_ALLDEBRID_APIKEY: "${DEBRID_ALLDEBRID_APIKEY:-}"
      DEBRID_TORBOX_APIKEY: "${DEBRID_TORBOX_APIKEY:-}"
      # Optional: protect the exposed API/UI with a bearer token.
      DEBRID_HUB_API_KEY: "${DEBRID_HUB_API_KEY:-}"
      DEBRID_HUB_CACHE_TTL: "60"
      DEBRID_HUB_DATA_DIR: "/data"
      # Optional: pin the encryption master key (else auto-generated in /data).
      # Set this if you want to move the encrypted store between hosts.
      DEBRID_HUB_SECRET_KEY: "${DEBRID_HUB_SECRET_KEY:-}"
      # Optional: folder for the JD2 "Start Download" watch-folder flow (see
      # the volume above) -- unset keeps the tray's clipboard-based flow.
      # DEBRID_HUB_WATCH_DIR: "/watch"
      # DEBRID_HUB_WATCH_CLEANUP_MINUTES: "60"
      # DEBRID_HUB_MOCK: "1"   # demo data, no keys needed
    # env_file: .env           # alternative to the environment: block above

volumes:
  debrid-hub-data:
