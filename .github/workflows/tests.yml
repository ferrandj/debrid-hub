name: Tests

on:
  push:
    branches: [master]
    paths:
      - "debrid-hub/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "debrid-hub/**"

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debrid-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debrid-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
